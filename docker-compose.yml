# NYC Taxi Streaming Pipeline — local infrastructure
#
# Services:
#   kafka-1/2/3   3-broker Kafka cluster, KRaft combined mode (no Zookeeper)
#   kafka-ui      Web UI to inspect topics/partitions/consumer lag
#   clickhouse    OLAP store for raw events + upserted aggregations
#   prometheus    Scrapes metrics from the streaming app + Kafka exporters
#   grafana       Dashboards over Prometheus
#
# Uses the official `apache/kafka` image (Apache Kafka project's own
# Docker Hub image), NOT bitnami/kafka -- Bitnami moved that image behind
# a paid "Secure Images" subscription and pulled every free tag from
# Docker Hub, which is why `bitnami/kafka:3.7` now 404s with
# "manifest unknown". apache/kafka is free and actively maintained.
#
# Each broker needs 3 listeners (this is the official image's documented
# pattern for a combined-mode multi-node cluster, not something specific
# to this project):
#   PLAINTEXT      inter-broker traffic, advertised via the container's
#                   own hostname (kafka-1/2/3) -- only reachable inside
#                   the Docker network, never exposed to the host.
#   PLAINTEXT_HOST  client-facing traffic, advertised via `localhost` +
#                   whatever unique host port that broker is mapped to
#                   (9092 / 9094 / 9096) -- this is what your Python
#                   producer/consumer actually connect to.
#   CONTROLLER      KRaft metadata/quorum traffic between the 3 brokers.
#
# Resource note (per assessment's own allowance): if your machine can't
# comfortably run 3 brokers, delete the kafka-2/kafka-3 services and
# change KAFKA_CONTROLLER_QUORUM_VOTERS on kafka-1 to just "1@kafka-1:9093".
# Topic creation's replication factor would then need to drop to 1 too
# (see docker/create_topics.sh).
#
# Data is NOT persisted across `docker compose down` (no named volumes
# for Kafka) -- this is a local demo/interview setup, not production;
# add volumes yourself if you want state to survive a restart.

services:

  kafka-1:
    image: apache/kafka:latest
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      CLUSTER_ID: eD6z3WfJnfHlk9YE0nfHow
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-2:
    image: apache/kafka:latest
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      CLUSTER_ID: eD6z3WfJnfHlk9YE0nfHow

  kafka-3:
    image: apache/kafka:latest
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "9096:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      CLUSTER_ID: eD6z3WfJnfHlk9YE0nfHow

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-1:19092,kafka-2:19092,kafka-3:19092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka_exporter
    command:
      - "--kafka.server=kafka-1:19092"
      - "--kafka.server=kafka-2:19092"
      - "--kafka.server=kafka-3:19092"
    ports:
      - "9308:9308"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: taxi_clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # native client
    environment:
      - CLICKHOUSE_USER=taxi
      - CLICKHOUSE_PASSWORD=taxi
      - CLICKHOUSE_DB=taxi_stream
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  prometheus:
    image: prom/prometheus:latest
    container_name: taxi_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    container_name: taxi_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  clickhouse_data:
  grafana_data:
