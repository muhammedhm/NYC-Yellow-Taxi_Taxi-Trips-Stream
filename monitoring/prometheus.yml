global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # producer/stream_producer.py -- runs on the host, not in Docker, so
  # Prometheus (which runs inside Docker) reaches it via the special
  # host.docker.internal DNS name Docker provides for exactly this case.
  - job_name: "taxi-stream-producer"
    static_configs:
      - targets: ["host.docker.internal:8001"]

  # consumer/stream_consumer.py -- same host-networking note as above.
  - job_name: "taxi-stream-consumer"
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # Broker health + consumer lag, via danielqsj/kafka-exporter (added in
  # docker-compose.yml). This is what answers "is my consumer keeping up
  # with the producer" -- Task 4's core observability ask.
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]
